<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product list with cart</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Flow+Circular&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dessert-container">
      <h1 class="title">Desserts</h1>
    </div>
    <div class="cart">
      <div class="heading">
        <h2>Your Cart</h2>
        <div class="cart-quantity">(0)</div>
      </div>
     <div class="cartContent"> <div class="placeHolder"><div class="emptyimage"></div>
      <span class="added-items">Your added items will appear here</span></div></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
